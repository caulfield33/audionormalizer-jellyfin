name: release

# Push a tag carrying your own version - 0.0.5, v1.2.0, 3 - and this builds both variants,
# publishes them as release assets, regenerates manifest.json to point at those assets, and
# commits it back to the default branch. Jellyfin sees the new version on its next check.
#
# The tag is one to three numbers, with an optional leading "v". build.sh prepends the Jellyfin
# line to it, so 0.0.5 ships as 1.0.0.5 for Jellyfin 10.11 and 2.0.0.5 for Jellyfin 12.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build both variants
        env:
          # Tag 0.0.5 -> RELEASE=0.0.5, so the plugin ships as 1.0.0.5 and 2.0.0.5.
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          # The shape of RELEASE is checked by build.sh, which is where the version string is
          # actually assembled - one rule, one place. All this step does is drop the "v".
          export RELEASE="${TAG#v}"
          # Shows up in the plugin catalogue, so point it at the release notes this tag generates.
          export CHANGELOG="Release $TAG - https://github.com/$REPO/releases/tag/$TAG"
          chmod +x build.sh tools/make-manifest.sh
          ./build.sh both

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: artifacts/*.zip
          generate_release_notes: true

      - name: Regenerate manifest
        env:
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          export CHANGELOG="Release $TAG - https://github.com/$REPO/releases/tag/$TAG"
          ./tools/make-manifest.sh \
            "https://github.com/$REPO/releases/download/$TAG" \
            "https://raw.githubusercontent.com/$REPO/$BRANCH/manifest.json"

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest for ${{ steps.tag.outputs.name }}"
          git push
